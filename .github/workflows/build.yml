name: Build OurTaiko (Release)

on:
  workflow_dispatch:
    inputs:
      publish_release:
        description: Publish a GitHub Release after all builds pass
        type: boolean
        default: false
      release_tag:
        description: 'New release tag (required when publishing, e.g. v1.0.0)'
        type: string
        required: false
        default: ''

permissions:
  contents: read

env:
  OURTAIKO_SKIN_PROFILE: green

jobs:
  validate-release:
    name: Validate release tag
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        if: inputs.publish_release
        uses: actions/checkout@v4
        with:
          submodules: false

      - name: Check new release tag
        if: inputs.publish_release
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
        shell: bash
        run: |
          if [[ -z "$RELEASE_TAG" ]]; then
            echo '::error::Enter a release_tag when publish_release is enabled.'
            exit 1
          fi
          if [[ "$RELEASE_TAG" == -* || "$RELEASE_TAG" == refs/* ]] || \
             ! git check-ref-format "refs/tags/$RELEASE_TAG"; then
            echo '::error::Invalid release_tag. Enter a tag name such as v1.0.0, without the refs/tags/ prefix.'
            exit 1
          fi
          if git ls-remote --exit-code --refs origin "refs/tags/$RELEASE_TAG"; then
            echo '::error::This release_tag already exists. Choose a new tag.'
            exit 1
          else
            status=$?
            if [[ "$status" != 2 ]]; then
              echo '::error::Could not check existing tags on the remote repository.'
              exit "$status"
            fi
          fi

  build-linux:
    name: Build on Linux
    needs: validate-release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: false

      - name: Generate application icons
        uses: ./.github/actions/generate-icons

      - name: Prepare skin dependencies
        uses: ./.github/actions/prepare-skins
        with:
          gitea-user: ${{ secrets.GITEA_USER }}
          gitea-token: ${{ secrets.GITEA_TOKEN }}
          allow-insecure-tls: ${{ vars.SKINS_ALLOW_INSECURE_TLS || 'true' }}

      - name: Install dependencies
        env:
          DEBIAN_FRONTEND: noninteractive
          NEEDRESTART_MODE: a
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            cmake \
            ninja-build \
            pkg-config \
            patchelf \
            libx11-dev \
            libxrandr-dev \
            libxinerama-dev \
            libxcursor-dev \
            libxi-dev \
            libxtst-dev \
            libgl1-mesa-dev \
            libasound2-dev \
            libpulse-dev \
            libjack-dev \
            liblua5.4-dev \
            libavcodec-dev \
            libavformat-dev \
            libavutil-dev \
            libswscale-dev \
            libswresample-dev \
            libavfilter-dev \
            libavdevice-dev \
            libogg-dev \
            libvorbis-dev \
            libflac-dev \
            libopus-dev \
            libmp3lame-dev \
            libmpg123-dev \
            libspeex-dev \
            libdw-dev

      - name: Setup SDL3
        id: sdl
        uses: libsdl-org/setup-sdl@main
        with:
          install-linux-dependencies: true
          version: 3-head
          build-type: Release

      - name: Configure CMake
        run: |
          cmake -B build \
            -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_CXX_COMPILER=g++ \
            -DCMAKE_C_COMPILER=gcc

      - name: Build
        run: cmake --build build --config Release

      - name: Prepare release package
        run: |
          mkdir -p release/OurTaiko-Linux
          cp build/bin/OurTaiko release/OurTaiko-Linux/
          cp build/bin/OurTaiko.png build/bin/install-desktop-entry.py release/OurTaiko-Linux/
          cmake -DSKINS_DIR="$PWD/Skins" -DSKINS_DEST_DIR="$PWD/release/OurTaiko-Linux/Skins" -P cmake/package_skins.cmake
          cp -r shader release/OurTaiko-Linux/
          cp -r Songs release/OurTaiko-Linux/
          cp config.toml release/OurTaiko-Linux/
          cp LICENSE NOTICE release/OurTaiko-Linux/
          cp update.sh release/OurTaiko-Linux/
          chmod +x release/OurTaiko-Linux/OurTaiko release/OurTaiko-Linux/update.sh

          # Bundle FFmpeg shared libraries into lib/
          mkdir -p release/OurTaiko-Linux/lib
          ldd build/bin/OurTaiko | grep -E "(libav|libsw).*=>" | awk '{print $3}' | \
            xargs -I{} cp -L {} release/OurTaiko-Linux/lib/

          # Bundle sndfile codec dependencies (ogg, vorbis, FLAC, opus, mp3, etc.)
          ldd build/bin/OurTaiko | grep -E "(libsndfile|libogg|libvorbis|libFLAC|libopus|libmp3lame|libmpg123|libspeex).*=>" | awk '{print $3}' | \
            grep -v "^$" | xargs -I{} cp -L {} release/OurTaiko-Linux/lib/ 2>/dev/null || true

          # Bundle SDL3 shared library
          ldd build/bin/OurTaiko | grep -E "libSDL3.*=>" | awk '{print $3}' | \
            grep -v "^$" | xargs -I{} cp -L {} release/OurTaiko-Linux/lib/ 2>/dev/null || true

          # Bundle transitive deps of FFmpeg AND sndfile codec libs
          for so in release/OurTaiko-Linux/lib/lib{av,sw,ogg,vorbis,FLAC,opus,mp3lame,mpg123,speex,SDL3}*.so*; do
            ldd "$so" 2>/dev/null | grep "=>" | awk '{print $3}' | grep -v "^$" | \
              grep -vE "lib(c\.so|m\.so|dl\.so|rt\.so|pthread\.so|gcc_s\.so|stdc\+\+\.so|X11\.so|GL\.so|asound\.so|pulse\.so|jack\.so|Xi\.so|Xrandr\.so|xcb)" | \
              grep -v "ld-linux" | \
              xargs -I{} cp -L {} release/OurTaiko-Linux/lib/ 2>/dev/null || true
          done

          # Patch rpath: binary looks in $ORIGIN/lib, bundled .so files look in $ORIGIN
          patchelf --set-rpath '$ORIGIN/lib' release/OurTaiko-Linux/OurTaiko
          for so in release/OurTaiko-Linux/lib/*.so*; do
            [ -f "$so" ] && patchelf --set-rpath '$ORIGIN' "$so" 2>/dev/null || true
          done

          # Checksums — binary + updater + shader + lib
          (
            cd release/OurTaiko-Linux
            sha256sum OurTaiko update.sh LICENSE NOTICE OurTaiko.png install-desktop-entry.py
            find shader -type f | sort | xargs sha256sum
            [ -d lib ] && find lib -type f | sort | xargs sha256sum || true
          ) > release/OurTaiko-Linux/checksums-linux.sha256

      - name: Upload Linux package
        uses: actions/upload-artifact@v4
        with:
          name: OurTaiko-Linux
          path: release/OurTaiko-Linux/
          if-no-files-found: error

  build-windows:
    name: Build on Windows
    needs: validate-release
    runs-on: windows-latest

    defaults:
      run:
        shell: msys2 {0}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: false

      - name: Generate application icons
        uses: ./.github/actions/generate-icons

      - name: Prepare skin dependencies
        uses: ./.github/actions/prepare-skins
        with:
          gitea-user: ${{ secrets.GITEA_USER }}
          gitea-token: ${{ secrets.GITEA_TOKEN }}
          allow-insecure-tls: ${{ vars.SKINS_ALLOW_INSECURE_TLS || 'true' }}

      - name: Setup MSYS2
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-cmake
            mingw-w64-x86_64-ninja
            mingw-w64-x86_64-pkg-config
            mingw-w64-x86_64-libsndfile
            mingw-w64-x86_64-libsamplerate
            mingw-w64-x86_64-lua
            mingw-w64-x86_64-ffmpeg
            mingw-w64-x86_64-sdl3
            mingw-w64-x86_64-libidn2
            git
            make

      - name: Configure CMake
        run: |
          cmake -B build \
            -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_CXX_COMPILER=g++ \
            -DCMAKE_C_COMPILER=gcc

      - name: Build
        run: cmake --build build --config Release

      - name: Prepare release package
        shell: bash
        run: |
          mkdir -p release/OurTaiko-Windows
          cp build/bin/OurTaiko.exe release/OurTaiko-Windows/
          cp build/bin/*.dll release/OurTaiko-Windows/ 2>/dev/null || true
          cmake -DSKINS_DIR="$PWD/Skins" -DSKINS_DEST_DIR="$PWD/release/OurTaiko-Windows/Skins" -P cmake/package_skins.cmake
          cp -r shader release/OurTaiko-Windows/
          cp -r Songs release/OurTaiko-Windows/
          cp config.toml release/OurTaiko-Windows/
          cp LICENSE NOTICE release/OurTaiko-Windows/
          cp update.ps1 update.bat release/OurTaiko-Windows/

          # Checksums — binary + updater + dlls + shader
          (
            cd release/OurTaiko-Windows
            sha256sum OurTaiko.exe update.ps1 update.bat LICENSE NOTICE
            find shader -type f | sort | xargs sha256sum
            find . -maxdepth 1 -name "*.dll" | sort | xargs sha256sum
          ) > release/OurTaiko-Windows/checksums-windows.sha256

      - name: Upload Windows package
        uses: actions/upload-artifact@v4
        with:
          name: OurTaiko-Windows
          path: release/OurTaiko-Windows/
          if-no-files-found: error

  build-macos:
    name: Build on macOS
    needs: validate-release
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: false

      - name: Generate application icons
        uses: ./.github/actions/generate-icons

      - name: Prepare skin dependencies
        uses: ./.github/actions/prepare-skins
        with:
          gitea-user: ${{ secrets.GITEA_USER }}
          gitea-token: ${{ secrets.GITEA_TOKEN }}
          allow-insecure-tls: ${{ vars.SKINS_ALLOW_INSECURE_TLS || 'true' }}

      - name: Install dependencies
        run: |
          brew install \
            cmake \
            ninja \
            pkg-config \
            ffmpeg \
            sdl3 \
            dylibbundler \
            libogg \
            libvorbis \
            flac \
            opus \
            lame \
            mpg123 \
            speex \
            libsndfile \
            libidn2

      - name: Configure CMake
        run: |
          export PKG_CONFIG_PATH="$(brew --prefix)/lib/pkgconfig${PKG_CONFIG_PATH:+:$PKG_CONFIG_PATH}"
          cmake -B build \
            -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_CXX_COMPILER=clang++ \
            -DCMAKE_C_COMPILER=clang \
            -DCMAKE_PREFIX_PATH="$(brew --prefix)" \
            -DCMAKE_EXE_LINKER_FLAGS="-L$(brew --prefix)/lib"

      - name: Build
        run: cmake --build build --config Release

      - name: Prepare release package
        run: |
          mkdir -p release/OurTaiko-macOS
          cp build/bin/OurTaiko release/OurTaiko-macOS/
          cp -R build/bin/OurTaiko.app release/OurTaiko-macOS/
          cmake -DSKINS_DIR="$PWD/Skins" -DSKINS_DEST_DIR="$PWD/release/OurTaiko-macOS/Skins" -P cmake/package_skins.cmake
          cp -r shader release/OurTaiko-macOS/
          cp -r Songs release/OurTaiko-macOS/
          cp config.toml release/OurTaiko-macOS/
          cp LICENSE NOTICE release/OurTaiko-macOS/
          cp update.sh release/OurTaiko-macOS/
          chmod +x release/OurTaiko-macOS/OurTaiko release/OurTaiko-macOS/update.sh

          # Bundle non-system dylib dependencies
          mkdir -p release/OurTaiko-macOS/lib
          dylibbundler -od -b \
            -x release/OurTaiko-macOS/OurTaiko \
            -d release/OurTaiko-macOS/lib \
            -p @executable_path/lib

          # Checksums — binary + updater + shader + lib
          (
            cd release/OurTaiko-macOS
            shasum -a 256 OurTaiko update.sh LICENSE NOTICE
            find OurTaiko.app -type f | sort | xargs shasum -a 256
            find shader -type f | sort | xargs shasum -a 256
            [ -d lib ] && find lib -type f | sort | xargs shasum -a 256 || true
          ) > release/OurTaiko-macOS/checksums-macos.sha256

      - name: Upload macOS package
        uses: actions/upload-artifact@v4
        with:
          name: OurTaiko-macOS
          path: release/OurTaiko-macOS/
          if-no-files-found: error

  build-android:
    name: Build Android APK
    needs: validate-release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: false

      - name: Generate application icons
        uses: ./.github/actions/generate-icons

      - name: Prepare skin dependencies
        uses: ./.github/actions/prepare-skins
        with:
          gitea-user: ${{ secrets.GITEA_USER }}
          gitea-token: ${{ secrets.GITEA_TOKEN }}
          allow-insecure-tls: ${{ vars.SKINS_ALLOW_INSECURE_TLS || 'true' }}

      - name: Configure Android signing
        id: signing
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          PUBLISH_RELEASE: ${{ github.event_name == 'workflow_dispatch' && inputs.publish_release }}
        run: bash tools/configure_android_signing_ci.sh

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"

      - name: Install NDK r27d and CMake 3.22.1
        run: |
          SDKMANAGER="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          yes | $SDKMANAGER --licenses >/dev/null 2>&1 || true
          $SDKMANAGER "ndk;27.3.13750724" "cmake;3.22.1" "platforms;android-35" "build-tools;34.0.0"

      - name: Check Android game data recovery
        run: |
          javac --release 11 -d "$RUNNER_TEMP/ourtaiko-android-tests" \
            android/app/src/main/java/org/ourtaiko/fanmade/GameDataInstaller.java \
            android/app/src/main/java/org/ourtaiko/fanmade/UpdateFiles.java \
            android/app/src/main/java/org/ourtaiko/fanmade/BundledSkinUpdater.java \
            tests/android/UpdateFilesTest.java \
            tests/android/GameDataInstallerTest.java
          java -cp "$RUNNER_TEMP/ourtaiko-android-tests" org.ourtaiko.fanmade.GameDataInstallerTest
          java -cp "$RUNNER_TEMP/ourtaiko-android-tests" org.ourtaiko.fanmade.UpdateFilesTest

      - name: Cache FFmpeg for Android arm64
        id: cache-ffmpeg
        uses: actions/cache@v4
        with:
          path: .android-ffmpeg
          key: android-ffmpeg-${{ hashFiles('tools/build_ffmpeg_android.sh') }}

      - name: Build FFmpeg for Android
        if: steps.cache-ffmpeg.outputs.cache-hit != 'true'
        run: |
          export ANDROID_NDK_HOME=$ANDROID_SDK_ROOT/ndk/27.3.13750724
          bash tools/build_ffmpeg_android.sh

      - name: Build OpenSSL for Android
        run: |
          export ANDROID_NDK_HOME=$ANDROID_SDK_ROOT/ndk/27.3.13750724
          bash tools/build_openssl_android.sh

      - name: Cache CMake dependencies
        uses: actions/cache@v4
        with:
          path: .cmake-deps
          key: android-cmake-deps-${{ hashFiles('cmake/deps.cmake') }}
          restore-keys: android-cmake-deps-

      - name: Write local.properties
        run: |
          echo "sdk.dir=$ANDROID_SDK_ROOT" > android/local.properties
          echo "cmake.dir=$ANDROID_SDK_ROOT/cmake/3.22.1" >> android/local.properties

      - name: Allocate Android version code
        run: echo "ANDROID_BUILD_VERSION_CODE=$(($(date +%s) - 1577836800))" >> "$GITHUB_ENV"

      - name: Build Release APK
        working-directory: android
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew assembleRelease --no-daemon -PourtaikoVersionCode="$ANDROID_BUILD_VERSION_CODE" -POurTaikoCiDebugSigning=${{ steps.signing.outputs.debug_signing }}

      - name: Generate Android update metadata
        env:
          RELEASE_TAG: ${{ inputs.release_tag || format('build-{0}-{1}', github.run_number, github.run_attempt) }}
        run: |
          python3 tools/android_update_manifest.py android/app/build/outputs/apk/release/OurTaiko-Android.apk \
            --version-code "$ANDROID_BUILD_VERSION_CODE" --tag "$RELEASE_TAG" \
            --output android/app/build/outputs/apk/release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: OurTaiko-Android
          path: |
            android/app/build/outputs/apk/release/OurTaiko-Android.apk
            android/app/build/outputs/apk/release/android-update.json
            android/app/build/outputs/apk/release/checksums-android.sha256
          if-no-files-found: error

  build-ios:
    name: Build unsigned iOS IPA
    needs: validate-release
    runs-on: macos-15
    env:
      CONFIGURATION: Release
      IOS_DEPLOYMENT_TARGET: "16.3"
      IOS_BUNDLE_IDENTIFIER: org.ourtaiko.player
      # build_ios.sh disables signing when no development team is supplied.
      IOS_DEVELOPMENT_TEAM: ""

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: false

      - name: Generate application icons
        uses: ./.github/actions/generate-icons

      - name: Prepare skin dependencies
        uses: ./.github/actions/prepare-skins
        with:
          gitea-user: ${{ secrets.GITEA_USER }}
          gitea-token: ${{ secrets.GITEA_TOKEN }}
          allow-insecure-tls: ${{ vars.SKINS_ALLOW_INSECURE_TLS || 'true' }}

      - name: Install build tools
        run: |
          if ! command -v cmake >/dev/null; then
            brew install cmake
          fi
          cmake --version
          python3 --version

      - name: Inspect iOS toolchain
        id: toolchain
        run: |
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version
          echo "xcode=$(xcodebuild -version | shasum -a 256 | awk '{print $1}')" >> "$GITHUB_OUTPUT"

      - name: Cache FFmpeg for iOS arm64
        uses: actions/cache@v4
        with:
          path: .ios-ffmpeg/iphoneos-arm64
          key: ios-ffmpeg-${{ runner.os }}-${{ runner.arch }}-iphoneos-arm64-${{ env.IOS_DEPLOYMENT_TARGET }}-${{ steps.toolchain.outputs.xcode }}-${{ hashFiles('tools/build_ffmpeg_ios.sh') }}

      - name: Build unsigned iOS app
        run: |
          ./build_ios.sh device

      - name: Package unsigned IPA
        run: |
          APP_PATH="$GITHUB_WORKSPACE/build-ios-device/bin/Release/OurTaiko.app"
          test -f "$APP_PATH/Info.plist"
          test -x "$APP_PATH/OurTaiko"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleSupportedPlatforms:0' "$APP_PATH/Info.plist")" = "iPhoneOS"
          xcrun lipo "$APP_PATH/OurTaiko" -verify_arch arm64

          IPA_STAGE="$(mktemp -d "$RUNNER_TEMP/ourtaiko-ipa.XXXXXX")"
          trap 'rm -rf "$IPA_STAGE"' EXIT
          mkdir -p "$IPA_STAGE/Payload" "$GITHUB_WORKSPACE/release"
          ditto --norsrc "$APP_PATH" "$IPA_STAGE/Payload/OurTaiko.app"
          ditto -c -k --norsrc --keepParent "$IPA_STAGE/Payload" "$GITHUB_WORKSPACE/release/OurTaiko-iOS-unsigned.ipa"
          (
            cd "$GITHUB_WORKSPACE/release"
            shasum -a 256 OurTaiko-iOS-unsigned.ipa > checksums-ios.sha256
          )

      - name: Upload unsigned IPA
        uses: actions/upload-artifact@v4
        with:
          name: OurTaiko-iOS
          path: |
            release/OurTaiko-iOS-unsigned.ipa
            release/checksums-ios.sha256
          compression-level: 0
          if-no-files-found: error

  build-summary:
    name: Build Summary
    runs-on: ubuntu-latest
    needs: [build-linux, build-windows, build-macos, build-android, build-ios]
    if: always()

    steps:
      - name: Check build status
        run: |
          echo "Linux build: ${{ needs.build-linux.result }}"
          echo "Windows build: ${{ needs.build-windows.result }}"
          echo "macOS build: ${{ needs.build-macos.result }}"
          echo "Android build: ${{ needs.build-android.result }}"
          echo "iOS build: ${{ needs.build-ios.result }}"

          if [[ "${{ needs.build-linux.result }}" != "success" ]] || \
             [[ "${{ needs.build-windows.result }}" != "success" ]] || \
             [[ "${{ needs.build-macos.result }}" != "success" ]] || \
             [[ "${{ needs.build-android.result }}" != "success" ]] || \
             [[ "${{ needs.build-ios.result }}" != "success" ]]; then
            echo "One or more builds failed!"
            exit 1
          fi

          echo "All builds completed successfully!"

  release:
    needs: [build-linux, build-windows, build-macos, build-android, build-ios]
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' && inputs.publish_release
    permissions:
      contents: write
    steps:
      - name: Download Linux artifact
        uses: actions/download-artifact@v4
        with:
          name: OurTaiko-Linux
          path: linux/

      - name: Download Windows artifact
        uses: actions/download-artifact@v4
        with:
          name: OurTaiko-Windows
          path: windows/

      - name: Download macOS artifact
        uses: actions/download-artifact@v4
        with:
          name: OurTaiko-macOS
          path: macos/

      - name: Download Android artifact
        uses: actions/download-artifact@v4
        with:
          name: OurTaiko-Android
          path: android-out/

      - name: Download iOS artifact
        uses: actions/download-artifact@v4
        with:
          name: OurTaiko-iOS
          path: ios-out/

      - name: Package release assets
        run: |
          # Artifact downloads normalize permissions; restore executable launchers.
          chmod +x linux/OurTaiko linux/update.sh macos/OurTaiko macos/update.sh \
            macos/OurTaiko.app/Contents/MacOS/OurTaiko
          # Full zips for manual download
          (cd linux   && zip -r ../OurTaiko-Linux.zip .)
          (cd windows && zip -r ../OurTaiko-Windows.zip .)
          (cd macos   && zip -r ../OurTaiko-macOS.zip .)
          cp android-out/OurTaiko-Android.apk OurTaiko-Android.apk
          cp android-out/android-update.json android-update.json
          cp android-out/checksums-android.sha256 checksums-android.sha256
          cp ios-out/OurTaiko-iOS-unsigned.ipa OurTaiko-iOS-unsigned.ipa

          # Metadata files
          cp linux/checksums-linux.sha256     ./checksums-linux.sha256
          cp windows/checksums-windows.sha256 ./checksums-windows.sha256
          cp macos/checksums-macos.sha256     ./checksums-macos.sha256
          cp ios-out/checksums-ios.sha256     ./checksums-ios.sha256

          # Linux update package: binary + updater + shader + lib
          UPDATE_LINUX="OurTaiko update.sh LICENSE NOTICE shader/ OurTaiko.png install-desktop-entry.py"
          [ -d linux/lib ] && UPDATE_LINUX="$UPDATE_LINUX lib/"
          tar -czf update-linux.tar.gz -C linux $UPDATE_LINUX

          # Windows update package: binary + updater + dlls + shader
          UPDATE_WIN="OurTaiko.exe update.ps1 update.bat LICENSE NOTICE shader/"
          for dll in windows/*.dll; do
            [ -f "$dll" ] && UPDATE_WIN="$UPDATE_WIN $(basename "$dll")"
          done
          tar -czf update-windows.tar.gz -C windows $UPDATE_WIN

          # macOS update package: binary + updater + shader + lib
          UPDATE_MACOS="OurTaiko update.sh LICENSE NOTICE shader/ OurTaiko.app/"
          [ -d macos/lib ] && UPDATE_MACOS="$UPDATE_MACOS lib/"
          tar -czf update-macos.tar.gz -C macos $UPDATE_MACOS

      - name: Upload Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            OurTaiko-Linux.zip
            OurTaiko-Windows.zip
            OurTaiko-macOS.zip
            OurTaiko-Android.apk
            OurTaiko-iOS-unsigned.ipa
            update-linux.tar.gz
            update-windows.tar.gz
            update-macos.tar.gz
            checksums-linux.sha256
