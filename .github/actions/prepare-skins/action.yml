name: Prepare skin dependencies
description: Restore or fetch only the pinned Green skin used for CI code generation and packaging
inputs:
  gitea-user:
    description: Optional username for private upstream skins
    default: ''
  gitea-token:
    description: Optional read-only token for private upstream skins
    default: ''
  allow-insecure-tls:
    description: Temporarily skip TLS verification only for the upstream skin host
    default: 'false'
runs:
  using: composite
  steps:
    - name: Read pinned skin revisions
      id: revisions
      shell: bash
      run: |
        key=$(git ls-tree HEAD -- Skins/PyTaikoGreen | git hash-object --stdin)
        echo "key=$key" >> "$GITHUB_OUTPUT"

    - name: Restore skins
      id: cache
      uses: actions/cache@v4
      with:
        path: Skins/PyTaikoGreen
        key: skins-green-v1-${{ hashFiles('.gitmodules') }}-${{ steps.revisions.outputs.key }}

    - name: Fetch skins
      if: steps.cache.outputs.cache-hit != 'true'
      shell: bash
      env:
        GITEA_USER: ${{ inputs.gitea-user }}
        GITEA_TOKEN: ${{ inputs.gitea-token }}
        SKINS_ALLOW_INSECURE_TLS: ${{ inputs.allow-insecure-tls }}
      run: bash "$GITHUB_ACTION_PATH/fetch.sh"

    - name: Verify skin assets
      shell: bash
      run: |
        test -s Skins/PyTaikoGreen/Graphics/skin_config.json
